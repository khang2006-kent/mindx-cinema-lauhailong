<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MindX Cinema — Trang Chủ</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="chat-widget.css">
  </head>
  <body>
    <header class="site-header">
      <div class="logo">MindX <span>Cinema</span></div>
      <div class="search-wrap">
        <input id="searchInput" placeholder="Tìm phim, diễn viên, thể loại..." />
        <button id="searchBtn">Tìm</button>
      </div>
      <nav class="nav-actions">
        <button id="loginBtn" type="button">Đăng nhập</button>
      </nav>
    </header>

    <main>
      <section class="hero" id="hero">
        <div class="hero-overlay">
          <h1 id="heroTitle">Phim hay hôm nay</h1>
          <p id="heroOverview"></p>
          <div class="hero-actions">
            <button id="playBtn" type="button">▶ Phát</button>
            <button id="favBtn" type="button">❤ Thêm yêu thích</button>
          </div>
        </div>
      </section>

      <section class="movies-section">
        <h2>Đang chiếu</h2>
        <div class="movies-row" id="nowPlaying"></div>
      </section>

      <section class="movies-section">
        <h2>Phổ biến</h2>
        <div class="movies-row" id="popular"></div>
      </section>

      <section class="movies-section">
        <h2>Đánh giá cao</h2>
        <div class="movies-row" id="topRated"></div>
      </section>
    </main>

    <footer class="site-footer">© 2026 MindX Cinema</footer>

    <button class="chat-widget-bubble" title="Trợ giúp từ AI">
      <span>💬</span>
      <span>Trợ giúp</span>
    </button>

    <div class="chat-widget-modal" role="dialog" aria-label="Trợ giúp AI">
      <div class="chat-widget-header">
        <h3>MindX Assistant</h3>
        <button class="chat-widget-close" type="button" aria-label="Đóng">×</button>
      </div>
      <div class="chat-widget-messages"></div>
      <div class="chat-widget-input">
        <input type="text" placeholder="Nhập câu hỏi...">
        <button type="button">Gửi</button>
      </div>
    </div>

    <script src="home.js"></script>
    <script src="chat-widget.js"></script>
  </body>
</html>
